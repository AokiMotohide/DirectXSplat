name: Static, Install, and Packaging

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warnings-install-consumer:
    name: Warnings, install, and consumer smoke test
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure with warnings as errors
        run: >
          cmake -S . -B build/warnings
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_BUILD_VIEWER=ON
          -DDXSPLAT_ENABLE_GPU_TESTS=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON
          -DDXSPLAT_WARNINGS_AS_ERRORS=ON

      - name: Build with warnings as errors
        run: cmake --build build/warnings --config Release --parallel

      - name: Install to temporary prefix
        run: cmake --install build/warnings --config Release --prefix "$env:RUNNER_TEMP/directxsplat-install"

      - name: Configure installed-package consumer
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "directxsplat-consumer"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          @'
          cmake_minimum_required(VERSION 3.25)
          project(DirectXSplatConsumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(DirectXSplat CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE DirectXSplat::DirectXSplat)
          enable_testing()
          add_test(NAME consumer COMMAND consumer)
          if(DEFINED DIRECTXSPLAT_RUNTIME_BIN)
            set_tests_properties(consumer PROPERTIES
              ENVIRONMENT_MODIFICATION "PATH=path_list_prepend:${DIRECTXSPLAT_RUNTIME_BIN}"
            )
          endif()
          '@ | Set-Content -Path (Join-Path $consumer "CMakeLists.txt") -NoNewline
          @'
          #include <directxsplat/context.h>
          #include <directxsplat/directxsplat.h>
          #include <directxsplat/gpu_resources.h>
          #include <directxsplat/io.h>
          #include <directxsplat/renderer.h>

          int main() {
            directxsplat::D3D12Context context{};
            directxsplat::Renderer renderer{};
            directxsplat::RendererConfig rendererConfig{};
            directxsplat::Scene scene{};
            directxsplat::RenderInput input{};
            directxsplat::RenderTargetBinding target{};
            directxsplat::RenderFrameContext frameContext{};
            directxsplat::RenderSubmissionInfo submission{};
            directxsplat::GpuBufferView buffer{};
            directxsplat::GpuTextureView texture{};
            directxsplat::GpuFrameResources frameResources{};
            directxsplat::UploadedSceneHandle uploadedScene{};
            directxsplat::UploadedChunkHandle uploadedChunk{};
            directxsplat::SceneMutationToken mutation{};
            directxsplat::SceneAccessInfo accessInfo{};
            directxsplat::UploadedSceneInfo sceneInfo{};
            directxsplat::UploadedChunkInfo chunkInfo{};
            directxsplat::UploadedSceneGpuResources sceneResources{};
            directxsplat::UploadedChunkGpuResources chunkResources{};
            directxsplat::UploadSyncPoint uploadSync{};
            directxsplat::DrawOptions draw{};
            directxsplat::ViewerConfig viewer{};
            viewer.width = 640;
            viewer.height = 480;
            return context.Device() == nullptr &&
                   !renderer.IsDeviceLost() &&
                   rendererConfig.maxUploadsPerFrame > 0 &&
                   scene.splatSets.empty() &&
                   input.viewportWidth == 1 &&
                   target.colorTarget == nullptr &&
                   !frameContext.HasFence() &&
                   !submission.submissionRequired &&
                   !buffer.IsValid() &&
                   !texture.IsValid() &&
                   !frameResources.colorValid &&
                   !uploadedScene.IsValid() &&
                   !uploadedChunk.IsValid() &&
                   !mutation.IsValid() &&
                   !accessInfo.readyToRender &&
                   !sceneInfo.readyToRender &&
                   !chunkInfo.resident &&
                   sceneResources.chunks.empty() &&
                   chunkResources.format == directxsplat::UploadedSceneBufferFormat::Unknown &&
                   !uploadSync.IsValid() &&
                   draw.width == 1600 &&
                   viewer.width == 640 ? 0 : 1;
          }
          '@ | Set-Content -Path (Join-Path $consumer "main.cpp") -NoNewline
          cmake -S $consumer -B "$env:RUNNER_TEMP/directxsplat-consumer-build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/directxsplat-install" -DDIRECTXSPLAT_RUNTIME_BIN="$env:RUNNER_TEMP/directxsplat-install/bin"

      - name: Build installed-package consumer
        run: cmake --build "$env:RUNNER_TEMP/directxsplat-consumer-build" --config Release --parallel

      - name: Run installed-package consumer
        run: ctest --test-dir "$env:RUNNER_TEMP/directxsplat-consumer-build" -C Release --output-on-failure

  release-smoke:
    name: Installed package artifacts
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure install-only smoke build
        run: >
          cmake -S . -B build/install-smoke
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=OFF
          -DDXSPLAT_BUILD_VIEWER=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build library for install smoke
        run: cmake --build build/install-smoke --config Release --target directxsplat --parallel

      - name: Install package artifacts
        run: cmake --install build/install-smoke --config Release --prefix "$env:RUNNER_TEMP/directxsplat-package"

      - name: Verify installed package artifacts
        run: |
          $prefix = "$env:RUNNER_TEMP/directxsplat-package"
          $required = @(
            "include/directxsplat/bounding.h",
            "include/directxsplat/context.h",
            "include/directxsplat/directxsplat.h",
            "include/directxsplat/extensions.h",
            "include/directxsplat/gpu_resources.h",
            "include/directxsplat/io.h",
            "include/directxsplat/math.h",
            "include/directxsplat/render_hooks.h",
            "include/directxsplat/renderer.h",
            "include/directxsplat/scene.h",
            "include/directxsplat/settings.h",
            "include/directxsplat/sort.h",
            "include/directxsplat/status.h",
            "include/directxsplat/types.h",
            "include/directxsplat/upscaling.h",
            "include/directxsplat/vram_format.h",
            "lib/cmake/DirectXSplat/DirectXSplatConfig.cmake",
            "lib/cmake/DirectXSplat/DirectXSplatConfigVersion.cmake",
            "lib/cmake/DirectXSplat/DirectXSplatTargets.cmake"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $prefix $_) -PathType Leaf) }
          if ($missing.Count -ne 0) {
            throw "Installed package is missing artifacts: $($missing -join ', ')"
          }
          $libraries = Get-ChildItem -Path (Join-Path $prefix "lib") -Filter "DirectXSplat.lib" -Recurse
          if ($libraries.Count -eq 0) {
            throw "Installed package did not contain DirectXSplat.lib"
          }
          $requiredHeaders = @(
            "include/directxsplat/bounding.h",
            "include/directxsplat/context.h",
            "include/directxsplat/directxsplat.h",
            "include/directxsplat/extensions.h",
            "include/directxsplat/gpu_resources.h",
            "include/directxsplat/io.h",
            "include/directxsplat/math.h",
            "include/directxsplat/render_hooks.h",
            "include/directxsplat/renderer.h",
            "include/directxsplat/scene.h",
            "include/directxsplat/settings.h",
            "include/directxsplat/sort.h",
            "include/directxsplat/status.h",
            "include/directxsplat/types.h",
            "include/directxsplat/upscaling.h",
            "include/directxsplat/vram_format.h"
          )
          $missingHeaders = $requiredHeaders | Where-Object { -not (Test-Path (Join-Path $prefix $_) -PathType Leaf) }
          if ($missingHeaders.Count -ne 0) {
            throw "Installed package is missing public headers: $($missingHeaders -join ', ')"
          }
          $installedHeaders = Get-ChildItem -Path (Join-Path $prefix "include/directxsplat") -Filter "*.h" -File | ForEach-Object { "include/directxsplat/$($_.Name)" }
          $extraHeaders = $installedHeaders | Where-Object { $_ -notin $requiredHeaders }
          if ($extraHeaders.Count -ne 0) {
            throw "Installed package contains unexpected public headers: $($extraHeaders -join ', ')"
          }
