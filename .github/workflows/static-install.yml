name: Static, Install, and Packaging

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warnings-install-consumer:
    name: Warnings, install, and consumer smoke test
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure with warnings as errors
        run: >
          cmake -S . -B build/warnings
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_BUILD_VIEWER=ON
          -DDXSPLAT_BUILD_LEGACY_EXAMPLES=OFF
          -DDXSPLAT_ENABLE_GPU_TESTS=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON
          -DDXSPLAT_WARNINGS_AS_ERRORS=ON

      - name: Build with warnings as errors
        run: cmake --build build/warnings --config Release --parallel

      - name: Install to temporary prefix
        run: cmake --install build/warnings --config Release --prefix "$env:RUNNER_TEMP/directxsplat-install"

      - name: Configure installed-package consumer
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP "directxsplat-consumer"
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null
          @'
          cmake_minimum_required(VERSION 3.25)
          project(DirectXSplatConsumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(DirectXSplat CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE DirectXSplat::DirectXSplat)
          '@ | Set-Content -Path (Join-Path $consumer "CMakeLists.txt") -NoNewline
          @'
          #include <dxsplat/renderer.h>
          int main() {
            dxsplat::Renderer renderer;
            return renderer.IsDeviceLost() ? 1 : 0;
          }
          '@ | Set-Content -Path (Join-Path $consumer "main.cpp") -NoNewline
          cmake -S $consumer -B "$env:RUNNER_TEMP/directxsplat-consumer-build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/directxsplat-install"

      - name: Build installed-package consumer
        run: cmake --build "$env:RUNNER_TEMP/directxsplat-consumer-build" --config Release --parallel

  release-smoke:
    name: Release packaging hygiene
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check repository hygiene
        run: |
          $missing = @("README.md", "LICENSE") | Where-Object { -not (Test-Path $_ -PathType Leaf) }
          if ($missing.Count -ne 0) {
            throw "Missing required release files: $($missing -join ', ')"
          }
          if (-not (Test-Path "tests/CMakeLists.txt" -PathType Leaf)) {
            throw "Root tests/CMakeLists.txt is missing"
          }
          $requiredDirs = @("directxsplat", "appcommon", "examples/common", "examples/imgui_viewer", "examples/minimal_viewer", "examples/offscreen_capture", "examples/external_d3d12_integration", "examples/scene_updates", "examples/gpu_resource_interop", "shaders", "tests/directxsplat", "tests/appcommon", "tests/imgui_viewer", "tests/examples")
          $missingDirs = $requiredDirs | Where-Object { -not (Test-Path $_ -PathType Container) }
          if ($missingDirs.Count -ne 0) {
            throw "Required repository folders are missing: $($missingDirs -join ', ')"
          }
          function HasExactName($names, $candidate) {
            foreach ($name in $names) {
              if ([string]::Equals($name, $candidate, [System.StringComparison]::Ordinal)) {
                return $true
              }
            }
            return $false
          }
          $rootDirs = Get-ChildItem -Force -Directory | ForEach-Object { $_.Name }
          $testDirs = Get-ChildItem tests -Force -Directory | ForEach-Object { $_.Name }
          $oldRootDirs = @("DirectXSplat", "AppCommon", "SampleApp") | Where-Object { HasExactName $rootDirs $_ }
          $oldTestDirs = @("DirectXSplat", "AppCommon", "SampleApp") | Where-Object { HasExactName $testDirs $_ } | ForEach-Object { "tests/$_" }
          $oldDirs = @($oldRootDirs) + @($oldTestDirs)
          if ($oldDirs.Count -ne 0) {
            throw "Old capitalized folders are present: $($oldDirs -join ', ')"
          }
          $forbiddenFiles = @("imgui.ini") | Where-Object { Test-Path $_ }
          if ($forbiddenFiles.Count -ne 0) {
            throw "Forbidden local state files are present: $($forbiddenFiles -join ', ')"
          }
          $forbiddenDirs = @("build", "build_*", "out", ".vs", "x64", "Debug", "Release") | Where-Object { Test-Path $_ -PathType Container }
          if ($forbiddenDirs.Count -ne 0) {
            throw "Stale build output directories are present: $($forbiddenDirs -join ', ')"
          }

      - name: Configure install-only smoke build
        run: >
          cmake -S . -B build/install-smoke
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=OFF
          -DDXSPLAT_BUILD_VIEWER=OFF
          -DDXSPLAT_BUILD_LEGACY_EXAMPLES=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build library for install smoke
        run: cmake --build build/install-smoke --config Release --target dxsplat --parallel

      - name: Install package artifacts
        run: cmake --install build/install-smoke --config Release --prefix "$env:RUNNER_TEMP/directxsplat-package"

      - name: Verify installed package artifacts
        run: |
          $prefix = "$env:RUNNER_TEMP/directxsplat-package"
          $required = @(
            "include/dxsplat/renderer.h",
            "include/dxsplat/context.h",
            "lib/cmake/DirectXSplat/DirectXSplatConfig.cmake",
            "lib/cmake/DirectXSplat/DirectXSplatConfigVersion.cmake",
            "lib/cmake/DirectXSplat/DirectXSplatTargets.cmake"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $prefix $_) -PathType Leaf) }
          if ($missing.Count -ne 0) {
            throw "Installed package is missing artifacts: $($missing -join ', ')"
          }
          $libraries = Get-ChildItem -Path (Join-Path $prefix "lib") -Filter "DirectXSplat.lib" -Recurse
          if ($libraries.Count -eq 0) {
            throw "Installed package did not contain DirectXSplat.lib"
          }
