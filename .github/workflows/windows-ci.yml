name: Core Tests

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_warp_renderer_tests:
        description: Run optional D3D12/WARP renderer tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc-core:
    name: MSVC ${{ matrix.config }} core tests
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config:
          - Debug
          - Release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake without GPU tests
        run: >
          cmake -S . -B "build/core-${{ matrix.config }}"
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_BUILD_VIEWER=ON
          -DDXSPLAT_ENABLE_GPU_TESTS=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build library, viewer, and tests
        run: >
          cmake --build "build/core-${{ matrix.config }}"
          --config ${{ matrix.config }}
          --parallel

      - name: List registered tests
        run: ctest --test-dir "build/core-${{ matrix.config }}" -C ${{ matrix.config }} -N

      - name: Verify registered test matrix
        run: |
          $expected = @(
            "DirectXSplatCoreTests",
            "DirectXSplatPlatformTests",
            "DirectXSplatViewerTests",
            "DirectXSplatRuntimeTests",
            "DirectXSplatPublicFacadeHeaderCompile",
            "DirectXSplatViewerFacadeHeaderCompile",
            "DirectXSplatRepositoryLayout"
          )
          $json = ctest --test-dir "build/core-${{ matrix.config }}" -C ${{ matrix.config }} --show-only=json-v1 | ConvertFrom-Json
          $actual = @($json.tests | ForEach-Object { $_.name })
          if (($actual -join "|") -ne ($expected -join "|")) {
            throw "Unexpected CTest matrix: $($actual -join ', ')"
          }

      - name: Run all core tests
        run: >
          ctest --test-dir "build/core-${{ matrix.config }}"
          -C ${{ matrix.config }}
          --output-on-failure
          --no-tests=error

      - name: Run loader and hostile input tests
        if: matrix.config == 'Release'
        run: >
          ctest --test-dir "build/core-${{ matrix.config }}"
          -C ${{ matrix.config }}
          -R "DirectXSplatCoreTests|DirectXSplatPlatformTests"
          --output-on-failure
          --no-tests=error

      - name: Run layout and shader invariant tests
        if: matrix.config == 'Release'
        run: >
          ctest --test-dir "build/core-${{ matrix.config }}"
          -C ${{ matrix.config }}
          -R "DirectXSplatCoreTests"
          --output-on-failure
          --no-tests=error

  library-only-core:
    name: Library-only tests without sample app
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure library-only tests
        run: >
          cmake -S . -B build/library-only
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_BUILD_VIEWER=OFF
          -DDXSPLAT_ENABLE_GPU_TESTS=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build library-only tests
        run: cmake --build build/library-only --config Release --parallel

      - name: Run library-only tests
        run: ctest --test-dir build/library-only -C Release --output-on-failure --no-tests=error

  product-viewer:
    name: Product viewer target
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure product viewer build
        run: >
          cmake -S . -B build/viewer
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_VIEWER=ON
          -DDXSPLAT_BUILD_EXAMPLES=ON
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_ENABLE_GPU_TESTS=OFF
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build product viewer target
        run: cmake --build build/viewer --config Release --target directxsplat_viewer

      - name: Build facade examples
        run: >
          cmake --build build/viewer
          --config Release
          --target DirectXSplatBasicViewerExample DirectXSplatConfiguredViewerExample

      - name: Verify product viewer artifacts
        run: |
          $bin = "build/viewer/bin/Release"
          $required = @(
            "DirectXSplatViewer.exe",
            "DirectXSplatBasicViewerExample.exe",
            "DirectXSplatConfiguredViewerExample.exe"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bin $_) -PathType Leaf) }
          if ($missing.Count -ne 0) {
            throw "Expected product artifacts were not built: $($missing -join ', ')"
          }
          $forbidden = @(
            "DirectXSplatMinimalViewer.exe",
            "DirectXSplatOffscreenCapture.exe"
          )
          $present = $forbidden | Where-Object { Test-Path (Join-Path $bin $_) -PathType Leaf }
          if ($present.Count -ne 0) {
            throw "Legacy example executables should not be present: $($present -join ', ')"
          }

      - name: Build product viewer tests
        run: cmake --build build/viewer --config Release --parallel

      - name: Run product viewer tests
        run: ctest --test-dir build/viewer -C Release --output-on-failure --no-tests=error

  optional-warp-renderer:
    name: Optional D3D12/WARP renderer tests
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch' && inputs.run_warp_renderer_tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure WARP renderer tests
        run: >
          cmake -S . -B build/warp-renderer
          -G "Visual Studio 17 2022" -A x64
          -DDXSPLAT_BUILD_TESTS=ON
          -DDXSPLAT_BUILD_VIEWER=OFF
          -DDXSPLAT_ENABLE_GPU_TESTS=ON
          -DDXSPLAT_ENABLE_WARNINGS=ON

      - name: Build renderer tests
        run: cmake --build build/warp-renderer --config Release --parallel

      - name: Run renderer tests
        run: >
          ctest --test-dir build/warp-renderer
          -C Release
          -R "DirectXSplatCoreTests"
          --output-on-failure
          --no-tests=error
